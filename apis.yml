name: Inofab
description: Inofab Health (a Clario company) is a digital respiratory health company headquartered in Ankara, Turkey, building connected spirometry and inhaler devices with cloud software for the home-based and clinical management of chronic respiratory conditions including asthma, COPD, and cystic fibrosis. Its product line spans the SpiroHome Personal portable ultrasonic spirometer, the SpiroClinic Pro and SpiroClinic Compact clinical-grade spirometers with EHR integration, the SpiroCloud web dashboard that collects and analyzes data from all connected SpiroHome and SpiroClinic devices, and the SpiroHaler smart inhaler attachments for medication adherence. Inofab was surfaced as a portfolio company of 500 Global and added to the API Evangelist network for enrichment; it does not currently publish a public developer portal, API documentation, or SDKs.
